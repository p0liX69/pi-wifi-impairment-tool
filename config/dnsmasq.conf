# dnsmasq configuration for the AP subnet.
# Generated/copied by setup.sh into /etc/dnsmasq.d/wifi-impair.conf

interface=__AP_IFACE__
bind-interfaces
no-resolv

# DHCP range for test clients
dhcp-range=__DHCP_RANGE_START__,__DHCP_RANGE_END__,255.255.255.0,24h

# Default gateway and DNS point at the Pi
dhcp-option=3,__AP_IP__
dhcp-option=6,__AP_IP__

# Upstream DNS resolvers
server=1.1.1.1
server=8.8.8.8

log-queries
log-dhcp
