#!/usr/sbin/nft -f
# nftables rules — NAT + forward policy for the impairment AP.
# Variables (__WAN_IFACE__, __AP_IFACE__, __AP_SUBNET__) are substituted by setup.sh.

flush ruleset

table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        # Masquerade AP client traffic going out via the WAN interface
        oifname "__WAN_IFACE__" masquerade
    }
}

table ip filter {
    chain forward {
        type filter hook forward priority 0; policy drop;
        # Allow AP → WAN (new connections)
        iifname "__AP_IFACE__" oifname "__WAN_IFACE__" accept
        # Allow established/related return traffic WAN → AP
        iifname "__WAN_IFACE__" oifname "__AP_IFACE__" ct state related,established accept
    }

    chain input {
        type filter hook input priority 0; policy accept;
        # Allow the web UI port from the AP subnet only
        iifname "__AP_IFACE__" tcp dport 8080 accept
        # Block all other inbound from AP clients (SSH management is via eth0)
        iifname "__AP_IFACE__" tcp dport != 8080 drop
    }
}
